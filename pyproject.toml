[project]
name = "world-happiness"
version = "0.2.0"
description = "World Happiness Report: a deployable Streamlit atlas plus a tested analysis and modelling toolkit"
readme = "README.md"
license = "MIT"
authors = [{ name = "Abdullahi Adinoyi Ibrahim" }]
requires-python = ">=3.10"
# Core = what the Streamlit dashboard needs (this is what Streamlit Cloud installs from uv.lock).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "country-converter>=1.2",
    "pandera>=0.24",
    "plotly>=6.0",
    "streamlit>=1.64",  # st.iframe, st.metric(delta_arrow=...)
]

[project.optional-dependencies]
# Modelling pipeline (`wh run`) and the Dash results app.
ml = [
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "xgboost>=2.1; sys_platform == 'darwin'",  # CPU build (no CUDA/NCCL) on Linux + Windows
    "xgboost-cpu>=2.1; sys_platform != 'darwin'",
    "dash>=3.0",
    "dash-ag-grid>=31",
]
causal = ["world-happiness[ml]", "dowhy>=0.13"]

[project.scripts]
wh = "world_happiness.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["N812", "N817"]  # `Figures as F`, `theme as T` are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=world_happiness --cov-report=term-missing"
markers = ["slow: needs optional extras (dowhy)"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["*/apps/dashboard.py"]  # exercised via streamlit AppTest (runs in a script thread)
