name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - run: uv run pytest --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  dashboard-only:
    # What Streamlit Community Cloud installs: core dependencies from uv.lock, no extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync python -c "import world_happiness.apps.dashboard"
      - name: Boot the app and hit the health endpoint
        run: |
          uv run --no-sync streamlit run streamlit_app.py --server.port 8501 &
          timeout 90 bash -c "until curl -fs http://localhost:8501/_stcore/health; do sleep 2; done"

  docker:
    needs: [lint, test, dashboard-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Smoke-test pipeline and both dashboards
        run: |
          docker compose up -d
          for url in http://localhost:8501/_stcore/health http://localhost:8050; do
            timeout 120 bash -c "until curl -fs $url >/dev/null; do sleep 3; done"
          done
          docker compose exec results test -f /app/outputs/metrics.csv
      - if: always()
        run: docker compose logs && docker compose down
