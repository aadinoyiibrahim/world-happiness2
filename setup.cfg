[metadata]
name = world-happiness
version = 0.1.0
description = Advanced analysis of World Happiness Report
author = Your Name
author_email = your.email@example.com
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find_namespace:
install_requires =
    pandas
    numpy
    scipy
    matplotlib
    plotly
    torch
    optuna
    shap
    statsmodels
    streamlit
    geopandas
python_requires = >=3.10

[options.packages.find]
where = src
include = world_happiness.*

[options.extras_require]
dev =
    pytest
    sphinx
    black